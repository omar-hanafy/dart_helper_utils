name: Auto release

on:
  push:
    branches: [main, dev]

permissions:
  contents: write

concurrency:
  group: auto-release-${{ github.repository }}-dart_helper_utils-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The tag must be pushed with a PAT: a tag pushed with GITHUB_TOKEN does
      # not start the tag-triggered publish workflow. The credential must
      # persist for the `git push` below, and this job uploads no artifacts.
      - name: Checkout # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.TAG_PUSH_PAT }}

      # Tag only when the version value changed, not on every pubspec edit
      # (a dependency-only change must not try to re-create a release).
      - name: Compare package versions
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail

          pubspec='pubspec.yaml'
          before="$BEFORE_SHA"

          if [[ "$before" =~ ^0+$ ]]; then
            echo 'Branch creation detected; no release tag will be created.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          new_version=$(awk '/^version:/ {print $2; exit}' "$pubspec" | tr -d "\"'")
          if [[ -z "$new_version" ]]; then
            echo "Unable to read version from $pubspec."
            exit 1
          fi

          if git cat-file -e "$before:$pubspec" 2>/dev/null; then
            old_version=$(git show "$before:$pubspec" | awk '/^version:/ {print $2; exit}' | tr -d "\"'")
          else
            old_version=''
          fi

          if [[ "$old_version" == "$new_version" ]]; then
            echo "Version remains $new_version; no release tag will be created."
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          stable_pattern='^[0-9]+\.[0-9]+\.[0-9]+(\+[0-9A-Za-z.-]+)?$'
          prerelease_pattern='^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+(\+[0-9A-Za-z.-]+)?$'

          if [[ "${GITHUB_REF_NAME}" == 'main' && ! "$new_version" =~ $stable_pattern ]]; then
            echo "main requires a stable semantic version, got $new_version."
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" == 'dev' && ! "$new_version" =~ $prerelease_pattern ]]; then
            echo "dev requires a prerelease semantic version, got $new_version."
            exit 1
          fi

          {
            echo 'changed=true'
            echo "value=$new_version"
            echo "tag=dart_helper_utils-v$new_version"
          } >> "$GITHUB_OUTPUT"

      - name: Verify tag is new
        if: steps.version.outputs.changed == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          git fetch --force --tags origin
          if git show-ref --verify --quiet "refs/tags/$tag" || \
              git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists. Never move or reuse a release tag."
            exit 1
          fi

      - name: Create and push tag
        if: steps.version.outputs.changed == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"

      - name: Create GitHub release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          args=("$tag" --verify-tag --generate-notes --target "$GITHUB_SHA")
          if [[ "${GITHUB_REF_NAME}" == 'dev' ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
