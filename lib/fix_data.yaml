  # Iterable.find duplicated package:collection's firstWhereOrNull, which this
  # package re-exports. Explicit `DHUCollectionsExtensions(x).find(...)` calls
  # are a manual step: the replacement lives in collection's IterableExtension.
  - title: "Replace with 'firstWhereOrNull'"
    date: 2026-10-28
    element:
      uris: ['dart_helper_utils.dart']
      method: 'find'
      inClass: 'Iterable'
    changes:
      - kind: 'rename'
        newName: 'firstWhereOrNull'
  # The Set-specific nullable extension duplicated the Iterable one exactly.
  - title: "Rename to 'DHUCollectionsExtensionsNS'"
    date: 2026-10-28
    element:
      uris: ['dart_helper_utils.dart']
      extension: 'DHUNullableSetExtensions'
    changes:
      - kind: 'rename'
        newName: 'DHUCollectionsExtensionsNS'

  # stringo 2.0.0 removed the String? synonyms isEmptyOrNull and
  # isNotEmptyOrNull, which this package re-exported. 7.x keeps deprecated
  # aliases on String? (see DHUNullSafeStringExtensions) so these transforms
  # also reach nullable receivers. Explicit overrides name stringo's
  # StringChecksExtensions, which still declares isBlank and isNotBlank.
  - title: "Rename to 'isBlank'"
    date: 2026-10-28
    element:
      uris: ['dart_helper_utils.dart']
      getter: 'isEmptyOrNull'
