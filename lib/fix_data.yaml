# Data-driven fixes for `dart fix --apply`.
#
# Every transform here migrates a member that a breaking release renamed or
# removed. Keep every transform from earlier releases; add new ones at the
# end of the section for their release. The fixtures in test_fixes/ prove
# each transform in CI (`dart fix test_fixes --compare-to-golden`).
#
# Extension members match by the receiver's static type, so each rename has
# an `inClass` transform for ordinary calls (`date.isAtSameDayAs(other)`) and
# an `inExtension` transform for explicit extension overrides
# (`DHUDateExtensions(date).isAtSameDayAs(other)`).
version: 1
transforms:
  # ---------------------------------------------------------------- 7.0.0
  - title: "Rename to 'isSameYearAs'"
    date: 2026-10-28
    element:
      uris: ['dart_helper_utils.dart']
      method: 'isAtSameYearAs'
      inClass: 'DateTime'
    changes:
      - kind: 'rename'
        newName: 'isSameYearAs'
  - title: "Rename to 'isSameYearAs'"
